          name: Publications
          url: /publications/
          weight: 20
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 25
        - identifier: blog
          name: Blog
          url: /posts/
          weight: 30
        - identifier: cv
          name: CV
          url: /cv/
          weight: 35
        - identifier: contact
          name: Contact
          url: /contact/
          weight: 40

  it:
    languageName: "Italiano"
    languageCode: "it"
    weight: 2
    contentDir: "content/it"
    title: "Giovanni Pinna"
    params:
      description: "Ricercatore AI & Ingegnere | Ph.D. in Data Science & AI Applicata"
    menu:
      main:
        - identifier: home
          name: Home
          url: /it/
          weight: 5
        - identifier: about
          name: Chi Sono
          url: /it/about/
          weight: 10
        - identifier: activities
          name: Attività
          url: /it/activities/
          weight: 15
