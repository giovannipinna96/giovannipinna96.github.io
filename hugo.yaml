    languageName: "English"
    languageCode: "en"
    weight: 1
    contentDir: "content/en"
    title: "Giovanni Pinna"
    params:
      description: "AI Researcher & Engineer | Ph.D. in Applied Data Science & AI"
    menu:
      main:
        - identifier: home
          name: Home
          url: /
          weight: 5
        - identifier: about
          name: About Me
          url: /about/
          weight: 10
