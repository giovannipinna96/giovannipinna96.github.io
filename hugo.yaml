          name: Pubblicazioni
          url: /it/publications/
          weight: 20
        - identifier: projects
          name: Progetti
          url: /it/projects/
          weight: 25
        - identifier: blog
          name: Blog
          url: /it/posts/
          weight: 30
        - identifier: cv
          name: CV
          url: /it/cv/
          weight: 35
        - identifier: contact
          name: Contatti
          url: /it/contact/
          weight: 40

params:
  env: production
  author: "Giovanni Pinna"
  description: "AI Researcher & Engineer | Ph.D. in Applied Data Science & AI"
  keywords: ["Giovanni Pinna", "AI Researcher", "NLP", "LLM", "Text-to-SQL", "Genetic Improvement", "Data Science", "Machine Learning"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  profileMode:
    enabled: false

  socialIcons:
    - name: x
      url: "https://x.com/giovannipinna96"
    - name: linkedin
      url: "https://www.linkedin.com/in/giovanni-pinna/"
    - name: github
      url: "https://github.com/giovannipinna96"
    - name: instagram
      url: "https://www.instagram.com/pinna.giova/"
    - name: email
      url: "mailto:giovanni.pinna@phd.units.it"

  assets:
    disableHLJS: false
    disableFingerprinting: false
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon-32x32.png"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
