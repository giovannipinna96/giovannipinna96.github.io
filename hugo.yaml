baseURL: "https://giovannipinna.net/"
title: "Giovanni Pinna"
theme: "PaperMod"
pagination:
  pagerSize: 5
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

minify:
  disableXML: true
  minifyOutput: true

